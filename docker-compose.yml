version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realty_messenger_crm_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://realty_crm:${POSTGRES_PASSWORD:-realty_secure_pw}@postgres:5432/realty_messenger_crm?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: realty_messenger_crm_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: realty_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realty_secure_pw}
      POSTGRES_DB: realty_messenger_crm
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty_crm -d realty_messenger_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: realty_messenger_crm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: realty_messenger_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  pg_data:
  redis_data:
